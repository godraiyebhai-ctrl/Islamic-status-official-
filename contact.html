<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Islamic Status Official</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f5;
            color: #222;
        }

        header {
            background: #075e3b;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        nav {
            background: #064d31;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 16px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #075e3b;
            text-align: center;
        }

        p {
            font-size: 18px;
            line-height: 2;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #075e3b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #064d31;
        }

        footer {
            background: #075e3b;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Islamic Status Official</h1>
    <p style="text-align:center;">
        ہم سے رابطہ کریں
    </p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="privacy.html">Privacy Policy</a>
</nav>

<div class="container">

    <h2>رابطہ کریں</h2>

    <p>
        اگر آپ کے پاس کوئی سوال، مشورہ یا رائے ہے تو ہمیں
        پیغام بھیج سکتے ہیں۔
    </p>

    <form action="mailto:YOUR-EMAIL@example.com" method="post" enctype="text/plain">

        <label for="name">آپ کا نام</label>
        <input type="text" id="name" name="name"
               placeholder="اپنا نام لکھیں" required>

        <label for="email">آپ کی ای میل</label>
        <input type="email" id="email" name="email"
               placeholder="اپنی ای میل لکھیں" required>

        <label for="message">آپ کا پیغام</label>
        <textarea id="message" name="message"
                  placeholder="اپنا پیغام یہاں لکھیں..." required></textarea>

        <button type="submit">پیغام بھیجیں</button>

    </form>

</div>

<footer>
    <p style="text-align:center; margin:0;">
        © 2026 Islamic Status Official — All Rights Reserved
    </p>
</footer>

</body>
</html>
